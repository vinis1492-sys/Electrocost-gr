<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b32"><link rel="manifest" href="manifest.json"><title>ElectroCost GR</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f4f6f5;color:#182923;margin:0}main{max-width:560px;margin:auto;padding:16px}header{background:#183b32;color:white;padding:22px;border-radius:18px}h1{margin:0;font-size:26px}small{color:#65736e}header small{color:#c7ddd4}section{background:white;border:1px solid #dce3df;border-radius:16px;padding:18px;margin:14px 0}h2{font-size:18px;margin:0 0 15px}label{display:block;margin:10px 0 5px}input,button,select{font:inherit;border:1px solid #cbd5d0;border-radius:10px;padding:11px}input{width:100%;min-width:0}button{background:white;color:#183b32;cursor:pointer}button.active,button.primary{background:#183b32;color:white}button.primary{width:100%;margin-top:10px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px}.qty{width:78px}.check{width:auto}.total{font-size:32px;font-weight:750}.range{font-size:23px;color:#183b32;font-weight:700}.muted{font-size:13px;color:#65736e}details{margin:12px 0}summary{cursor:pointer;font-weight:bold}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:5px} @media print{button,details,.seg{display:none}body{background:white}section{break-inside:avoid}}</style><main><header><h1>⚡ ElectroCost GR</h1><small>Quick Estimate · V1.0</small></header><section><h2>Στοιχεία έργου</h2><label>Πελάτης / Έργο</label><input id="name" placeholder="Όνομα ή διεύθυνση"><label>Επιφάνεια (m²) — πληροφοριακά</label><input id="sqm" type="number" min="0" inputmode="decimal"><div class="line"><button onclick="resetAll()">Νέα εκτίμηση</button><button onclick="preset(0)">Πανόρμου</button><button onclick="preset(1)">Παιανία</button></div></section><section><h2>Βασικές εργασίες</h2><div id="jobs"></div><small>0: Καμία · 1: Οικονομική · 2: Κανονική · 3: Αυξημένη</small></section><section><h2>Εγκαταστάσεις ανά τεμάχιο</h2><div id="extras"></div><label><input class="check" id="test" type="checkbox"> Τελικοί έλεγχοι</label><label>Υλικά (€)</label><input id="mat" type="number" min="0" inputmode="decimal" placeholder="Δεν έχουν κοστολογηθεί"><label><input class="check" id="vat" type="checkbox"> ΦΠΑ 24%</label></section><section><h2>Εκτίμηση</h2><div id="result"></div><button class="primary" onclick="copyEstimate()">Αντιγραφή εκτίμησης</button><button class="primary" onclick="saveEstimate()">Αποθήκευση προσφοράς</button><button class="primary" onclick="print()">Εκτύπωση / PDF</button><p class="muted" id="status"></p></section><section><details><summary>Ρυθμίσεις τιμοκαταλόγου</summary><div id="rates"></div><button onclick="restoreRates()">Επαναφορά αρχικών τιμών</button></details><details><summary>Ιστορικό προσφορών</summary><div id="history"></div></details></section></main><script>
const $=id=>document.getElementById(id), money=x=>x.toLocaleString('el-GR',{style:'currency',currency:'EUR'}),num=x=>Math.max(0,Number(x)||0), defaults=[[100,200,350],[250,400,700],[150,300,600],[150,300,650],[160],[12],[7],[7],[160]],names=['Αποξηλώσεις','Σκαψίματα','Περάσματα καλωδίων','Σωλήνες και κουτιά','Πίνακες','Φωτιστικά','Πρίζες','Διακόπτες','Τελικοί έλεγχοι'];function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}let rates=read('ecRates',defaults),sel=[0,0,0,0],qty=[0,0,0,0],history=read('ecHistory',[]),last='';function draw(){ $('jobs').innerHTML=names.slice(0,4).map((n,i)=>`<div class="line"><b>${n}</b><b id="j${i}"></b></div><div class="seg">${[0,1,2,3].map(v=>`<button id="b${i}${v}" onclick="choose(${i},${v})">${v}</button>`).join('')}</div>`).join('');$('extras').innerHTML=names.slice(4,8).map((n,i)=>`<div class="line"><div><b>${n}</b><br><small id="r${i}"></small></div><input aria-label="${n}" class="qty" type="number" min="0" step="1" inputmode="numeric" id="q${i}" value="${qty[i]}" oninput="qty[${i}]=Math.floor(num(this.value));calc()"><b id="e${i}"></b></div>`).join('');$('rates').innerHTML=rates.map((r,i)=>`<label>${names[i]}</label><div class="rates">${r.map((v,j)=>`<input aria-label="${names[i]} ${j+1}" type="number" min="0" value="${v}" onchange="rates[${i}][${j}]=num(this.value);store('ecRates',rates);calc()">`).join('')}</div>`).join('');calc();showHistory()}
function choose(i,v){sel[i]=v;calc()}function calc(){let labor=0;sel.forEach((v,i)=>{let a=v?rates[i][v-1]:0;labor+=a;$('j'+i).textContent=money(a);[0,1,2,3].forEach(k=>$('b'+i+k).classList.toggle('active',k===v))});qty.forEach((v,i)=>{let a=v*rates[i+4][0];labor+=a;$('r'+i).textContent=money(rates[i+4][0])+'/τεμ.';$('e'+i).textContent=money(a)});if($('test').checked)labor+=rates[8][0];let mat=num($('mat').value),net=labor+mat,tax=$('vat').checked?net*.24:0,total=net+tax,lo=Math.floor(total*.9/50)*50,hi=Math.ceil(total*1.1/50)*50;$('result').innerHTML=`<div class="line">Εργατικά <b>${money(labor)}</b></div><div class="line">Υλικά <b>${$('mat').value===''?'Εκκρεμούν':money(mat)}</b></div><div class="line">ΦΠΑ <b>${$('vat').checked?money(tax):'Δεν περιλαμβάνεται'}</b></div><div class="total">${money(total)}</div><p>Ενδεικτικό εύρος (±10%, στρογγυλοποιημένο)</p><div class="range">${money(lo)} – ${money(hi)}</div><p class="muted">Πρώτη εκτίμηση, όχι δεσμευτική προσφορά. Απαιτείται αυτοψία.</p>`;last=`ElectroCost GR — ${$('name').value||'Έργο'}\nΕργατικά: ${money(labor)}\nΥλικά: ${$('mat').value===''?'Δεν έχουν κοστολογηθεί':money(mat)}\nΕύρος: ${money(lo)} – ${money(hi)} (${ $('vat').checked?'με':'χωρίς'} ΦΠΑ)\nΤελική προσφορά μετά από αυτοψία.`}function snapshot(){return {name:$('name').value,sqm:$('sqm').value,sel:[...sel],qty:[...qty],mat:$('mat').value,vat:$('vat').checked,test:$('test').checked,rates:JSON.parse(JSON.stringify(rates)),date:new Date().toLocaleString('el-GR'),summary:last}}function load(o){$('name').value=o.name;$('sqm').value=o.sqm;sel=[...o.sel];qty=[...o.qty];$('mat').value=o.mat;$('vat').checked=o.vat;$('test').checked=o.test;if(o.rates)rates=o.rates;draw()}function resetAll(){load({name:'',sqm:'',sel:[0,0,0,0],qty:[0,0,0,0],mat:'',vat:false,test:false})}function preset(i){load({name:i?'Παιανία':'Πανόρμου',sqm:i?130:22,sel:Array(4).fill(i?3:2),qty:i?[1,10,26,15]:[1,10,20,13],mat:'',vat:false,test:!!i})}function restoreRates(){rates=JSON.parse(JSON.stringify(defaults));store('ecRates',rates);draw()}function saveEstimate(){history.unshift(snapshot());$('status').textContent=store('ecHistory',history)?'Αποθηκεύτηκε στη συσκευή.':'Η μόνιμη αποθήκευση δεν είναι διαθέσιμη.';showHistory()}function showHistory(){let el=$('history');el.replaceChildren();history.forEach((o,i)=>{let p=document.createElement('div');p.className='line';let b=document.createElement('button');b.textContent=(o.name||'Έργο')+' · '+o.date;b.onclick=()=>load(o);let d=document.createElement('button');d.textContent='×';d.onclick=()=>{history.splice(i,1);store('ecHistory',history);showHistory()};p.append(b,d);el.append(p)})}async function copyEstimate(){try{await navigator.clipboard.writeText(last);$('status').textContent='Αντιγράφηκε.'}catch{prompt('Αντιγραφή εκτίμησης',last)}}['name','sqm','mat','vat','test'].forEach(id=>$(id).addEventListener('input',calc));draw();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
